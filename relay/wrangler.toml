name = "echoflow-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Daily request total (created on first deploy).
[[kv_namespaces]]
binding = "COUNTS"

# Run next to Google's US servers: calls to the Gemini API from some Cloudflare locations are
# refused with "User location is not supported".
[placement]
region = "gcp:us-central1"

# Per-network burst limit: 15 AI requests a minute from one IP (no storage used).
[[ratelimits]]
name = "PER_NETWORK"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 15
  period = 60
